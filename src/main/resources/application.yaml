application:
  users: []
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"
spring:
  datasource:
    url: jdbc:h2:file:./db/database;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: admin
    password: password
    driver-class-name: org.h2.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/{vendor}
    placeholders:
      # Timezone used by the old LocalDateTime values during legacy migration.
      legacy_timezone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
